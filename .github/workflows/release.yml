name: Release

# Runs when a version tag such as v0.1.0 is pushed. Builds the plugin, checks it
# the same way as every other build, and publishes the files on the repo's
# Releases page. Tags are only pushed after Jake has tested that build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in CMakeLists.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^project(PuppyChow VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag $tag, CMake version $version"
          test "$tag" = "$version"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Engine tests
        run: ctest --test-dir build --output-on-failure

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/PuppyChow_artefacts/Release/AU/Puppy Chow.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Pchw Jdrg

      - name: Package
        run: |
          out="PuppyChow-${GITHUB_REF_NAME}-macOS"
          mkdir -p "dist/$out"
          cp -R "build/PuppyChow_artefacts/Release/AU/Puppy Chow.component" "dist/$out/"
          cp -R "build/PuppyChow_artefacts/Release/VST3/Puppy Chow.vst3" "dist/$out/"
          cp -R "build/PuppyChow_artefacts/Release/Standalone/Puppy Chow.app" "dist/$out/"
          cp CHANGELOG.md "dist/$out/"
          (cd dist && ditto -c -k --keepParent "$out" "$out.zip")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: this version's section of the changelog.
          awk -v v="$version" '$0 ~ "^## " v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/PuppyChow-${GITHUB_REF_NAME}-macOS.zip" \
            --title "Puppy Chow $version" --notes-file notes.md $prerelease
